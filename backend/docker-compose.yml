services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinical-system-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/clinical_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-clinical_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-clinical_pass}
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/clinical_chat}
      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST:-redis}
      SPRING_REDIS_PORT: ${SPRING_REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET}
      APPLICATION_JWT_SECRET: ${JWT_SECRET}
      APPLICATION_JWT_EXPIRATION: ${APPLICATION_JWT_EXPIRATION:-900000}
      APPLICATION_JWT_REFRESH_EXPIRATION: ${APPLICATION_JWT_REFRESH_EXPIRATION:-604800000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      # NOTE: these names must match the ${...} placeholders application.yml actually reads
      # (application.aws.*) — AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_S3_BUCKET look like
      # standard AWS SDK env var names but Spring never looked for those exact names here.
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:-clinical-dev-bucket}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BASE_URL: ${S3_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clinical-net

  postgres:
    image: postgres:16-alpine
    container_name: clinical-postgres
    environment:
      POSTGRES_DB: clinical_db
      POSTGRES_USER: clinical_user
      POSTGRES_PASSWORD: clinical_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinical_user -d clinical_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinical-net

  mongo:
    image: mongo:7-jammy
    container_name: clinical-mongo
    environment:
      MONGO_INITDB_DATABASE: clinical_chat
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinical-net

  redis:
    image: redis:7-alpine
    container_name: clinical-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinical-net

  # Local S3-compatible object store for dev — the app auto-creates its bucket on
  # startup (see AwsConfig.ensureBucketExists) once S3_ENDPOINT points here. Swap in
  # real AWS credentials/S3_ENDPOINT="" to use actual AWS S3 instead (e.g. in prod).
  minio:
    image: minio/minio:latest
    container_name: clinical-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinical-net

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  minio_data:

networks:
  clinical-net:
    driver: bridge
