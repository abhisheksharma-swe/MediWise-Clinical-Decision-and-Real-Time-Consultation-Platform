name: MediWise Clinical System CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'mediwise-admin/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'mediwise-admin/**'
      - '.github/workflows/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/clinical-system-backend

jobs:
  # ─── Backend: Test & Build ──────────────────────────────────────────────────
  backend-ci:
    name: Backend (Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clinical_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mongo:
        image: mongo:7-jammy
        env:
          MONGO_INITDB_DATABASE: clinical_chat_test
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit & Integration Tests
        run: mvn clean test -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/clinical_test
          SPRING_DATASOURCE_USERNAME: test_user
          SPRING_DATASOURCE_PASSWORD: test_pass
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/clinical_chat_test
          SPRING_REDIS_HOST: localhost
          APP_JWT_SECRET: test-jwt-secret-for-ci-only-256-bits-padded-here
          AWS_ACCESS_KEY: test-key
          AWS_SECRET_KEY: test-secret
          AWS_REGION: ap-south-1

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/

      - name: Build Application Package (JAR)
        run: mvn package -DskipTests -B

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinical-backend-jar
          path: backend/target/clinical-backend-*.jar

  # ─── Admin Dashboard: Lint & Build ─────────────────────────────────────────
  admin-ci:
    name: Admin Portal (Vite & React Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mediwise-admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mediwise-admin/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Upload Admin Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: mediwise-admin/dist/

  # ─── Docker Build & Push to GHCR ────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    needs: [backend-ci, admin-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Production Deployment (AWS ECS) ────────────────────────────────────────
  deploy-production:
    name: Deploy to Production (AWS ECS)
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Check AWS Credentials
        id: check-aws
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_KEY }}
        run: |
          if [ -z "$AWS_KEY" ] || [ -z "$AWS_SECRET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=AWS Deployment Skipped::AWS credentials are not configured in GitHub Secrets. Skipping production deployment to AWS ECS without error."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.check-aws.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        if: steps.check-aws.outputs.configured == 'true'
        id: aws-creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Download Task Definition
        if: steps.check-aws.outputs.configured == 'true' && steps.aws-creds.outcome == 'success'
        id: download-task-def
        continue-on-error: true
        run: |
          aws ecs describe-task-definition \
            --task-definition clinical-system-task \
            --query taskDefinition \
            > task-definition.json

      - name: Update ECS Task Definition with new image
        if: steps.check-aws.outputs.configured == 'true' && steps.download-task-def.outcome == 'success'
        id: task-def
        continue-on-error: true
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: clinical-system-app
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Deploy to ECS Service
        if: steps.check-aws.outputs.configured == 'true' && steps.task-def.outcome == 'success'
        continue-on-error: true
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: clinical-system-service
          cluster: clinical-system-cluster
          wait-for-service-stability: true
